camera_name: garage
utc_offset: "+07:00"      # Jakarta (WIB), no daylight saving

source:
  type: webcam            # webcam | file | rtsp
  # ${NAME} placeholders are filled in from .env, so credentials stay out of this file.
  # Real camera: rtsp://${CAMERA_USER}:${CAMERA_PASS}@CAMERA_IP:554/stream2 (detect)
  #              rtsp://${CAMERA_USER}:${CAMERA_PASS}@CAMERA_IP:554/stream1 (snapshot)
  # Test stream from MediaMTX. Use 127.0.0.1, not localhost: Windows tries IPv6 (::1) first and times out.
  detect_url: rtsp://127.0.0.1:8554/garage
  snapshot_url: rtsp://127.0.0.1:8554/garage
  webcam_index: 0
  file_path: clips/test.mp4
  file_realtime: true     # false = replay the file as fast as possible (for tuning on clips)

detection:
  model: yolo11n.pt       # smallest current YOLO model
  fps: 3                  # frames analysed per second
  min_confidence: 0.5
  zone_mask: null         # optional polygon of normalized [x, y] points, e.g. [[0.1, 0.2], [0.9, 0.2], [0.9, 1.0], [0.1, 1.0]]

events:
  min_presence_seconds: 5     # person must persist this long to start an event (filters passers-by)
  end_after_seconds: 30       # event ends after this long with no person
  cooldown_seconds: 300       # ignore re-triggers right after an event
  pending_grace_seconds: 1    # missed detections this short don't reset the start timer (YOLO flickers)
  # Arrivals must start here: the street beyond the gate, right side (feet of the person).
  # Tuned on the evening camera view of 2026-11-10. Redraw it if the camera is re-aimed:
  # run with --debug-view and click the corners. null = anyone anywhere can start an arrival.
  entry_zone: [[0.56, 0.40], [1.0, 0.40], [1.0, 0.64], [0.56, 0.62]]
  # Two-stage rule (src/confirm.py): an arrival above is only a heads-up. It's confirmed when someone
  # from the street walks into the garage, or someone comes out of the garage to meet them, within
  # confirm_wait_seconds. Named areas of the same camera view; one must be called garage.
  # null = one-stage: every arrival counts.
  places:
    far_side:     [[0.56, 0.40], [1.0, 0.40], [1.0, 0.55], [0.56, 0.535]]
    our_frontage: [[0.56, 0.535], [1.0, 0.55], [1.0, 0.66], [0.56, 0.62]]
    garage:       [[0.0, 0.30], [0.56, 0.30], [0.56, 0.62], [1.0, 0.66], [1.0, 1.0], [0.0, 1.0]]
  confirm_wait_seconds: 90

storage:
  db_path: data/events.db
  snapshot_dir: data/snapshots
  retention_days: 14

logging:
  level: INFO             # DEBUG | INFO | WARNING | ERROR
  file: logs/camera.log
